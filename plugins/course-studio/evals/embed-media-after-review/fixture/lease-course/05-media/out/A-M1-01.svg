<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" role="img" font-family="Arial, sans-serif">
<title>Lease sections</title>
<desc>The five main sections of a commercial lease, in reading order: premises, term, rent, use, defaults. Arrows lead from each section to the next.</desc>
<rect width="640" height="120" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<rect x="8" y="36" width="104" height="48" rx="6" fill="#1d4ed8"/>
<text x="60" y="66" fill="#ffffff" font-size="16" text-anchor="middle">Premises</text>
<line x1="114" y1="60" x2="133" y2="60" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="136" y="36" width="104" height="48" rx="6" fill="#1d4ed8"/>
<text x="188" y="66" fill="#ffffff" font-size="16" text-anchor="middle">Term</text>
<line x1="242" y1="60" x2="261" y2="60" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="264" y="36" width="104" height="48" rx="6" fill="#1d4ed8"/>
<text x="316" y="66" fill="#ffffff" font-size="16" text-anchor="middle">Rent</text>
<line x1="370" y1="60" x2="389" y2="60" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="392" y="36" width="104" height="48" rx="6" fill="#1d4ed8"/>
<text x="444" y="66" fill="#ffffff" font-size="16" text-anchor="middle">Use</text>
<line x1="498" y1="60" x2="517" y2="60" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="520" y="36" width="104" height="48" rx="6" fill="#1d4ed8"/>
<text x="572" y="66" fill="#ffffff" font-size="16" text-anchor="middle">Defaults</text>
</svg>
